<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23003f8c'/%3E%3Ctext%20x='16'%20y='23'%20font-size='18'%20font-weight='bold'%20text-anchor='middle'%20fill='%23ffca29'%20font-family='sans-serif'%3E%E6%9D%B0%3C/text%3E%3C/svg%3E" />
    <title>杰米多多电商后台管理系统</title>
    <!-- 首屏加载层样式放在 head：Vue 挂载后不会被移除，避免白屏 -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(160deg, #2a78cc 0%, #3284dd 46%, #1a5aa8 100%);
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(160deg, #2a78cc 0%, #3284dd 46%, #1a5aa8 100%);
        color: #f2f7ff;
        font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        transition: opacity 0.25s ease;
      }
      #boot-loader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: linear-gradient(135deg, #ffe38f, #ffca29 60%, #e9a800);
        box-shadow: 0 10px 24px -8px rgba(255, 202, 41, 0.75);
        color: #0d1b36;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 21px;
        font-weight: 800;
      }
      .boot-title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .boot-tip {
        margin-top: -6px;
        color: rgba(240, 247, 255, 0.7);
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .boot-spinner {
        width: 22px;
        height: 22px;
        margin-top: 4px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-top-color: #ffca29;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- 首屏加载层：首条路由解析完成后由 main.js 淡出 -->
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-mark">杰</div>
      <div class="boot-title">杰米多多</div>
      <div class="boot-tip">正在加载…</div>
      <span class="boot-spinner"></span>
    </div>
    <div id="stepin-app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if (!global) {
        var global = globalThis;
      }
    </script>
  </body>
</html>
